# Render blueprint: the MCP server and the web app, from one repo, as one
# service.
#
# They used to deploy separately, which meant each had to be told the other's
# URL — and Render only assigns those URLs after the services exist, so the
# references were either hardcoded or resolved to the wrong (private) hostname.
# Serving both from one Express process removes the question entirely: one
# origin, and RENDER_EXTERNAL_URL is the only address anything needs.
#
# In Render: New → Blueprint, pick this repo. Values marked `sync: false` are
# prompted for on the first deploy and stored as secrets rather than in git.
services:
  - type: web
    name: tally
    runtime: node
    plan: free

    # No rootDir: the build spans both packages. The frontend is built first,
    # and the backend's build copies frontend/dist into dist/public (see
    # backend/scripts/bundle-web.mjs), so the deploy is one self-contained tree.
    buildCommand: >-
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      npm ci --prefix backend &&
      npm run build --prefix backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /health

    # PUBLIC_URL is deliberately not set here. Render appends a suffix when a
    # name is taken, so this service's real hostname is not knowable in advance;
    # the server falls back to RENDER_EXTERNAL_URL, which Render always sets to
    # the actual URL. Set PUBLIC_URL explicitly only if you later put a custom
    # domain in front.
    #
    # APP_URL is gone for the same reason it was a problem: the app is this
    # service, so its URL is PUBLIC_URL.
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Read by the server at runtime. The anon key, never the service-role key
      # — startup refuses the latter.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Baked into the frontend bundle by Vite at build time, so these are build
      # inputs rather than runtime config — changing one needs a redeploy. Same
      # two values as above; Vite only exposes variables it can see under a
      # VITE_ prefix, which is why they are repeated.
      #
      # The anon key belongs in the bundle: it is public by design, and RLS is
      # what protects the data. A service-role key here would be a disaster.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # Session pooler string (port 5432) for the restricted mcp_oauth_rw role.
      # See supabase/create_mcp_role.sql.
      - key: DATABASE_URL
        sync: false
