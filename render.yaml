# Render blueprint: the MCP server and the web app, from one repo.
#
# In Render: New → Blueprint, pick this repo. Values marked `sync: false` are
# prompted for on the first deploy and stored as secrets rather than in git.
services:
  # ---------------------------------------------------------------- MCP server
  - type: web
    name: tally
    runtime: node
    plan: free
    # The repo root holds the frontend too, so build and run from backend/.
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      # PUBLIC_URL is deliberately absent. Render appends a suffix when a name
      # is taken, so the real hostname is not knowable here; the server falls
      # back to RENDER_EXTERNAL_URL, which Render sets to the actual URL. Set
      # PUBLIC_URL explicitly only for a custom domain.
      - key: NODE_VERSION
        value: "22"

      # Linked from the consent screen. Wired to the static site below, so it
      # tracks whatever hostname Render gives it.
      - key: APP_URL
        fromService:
          type: web
          name: tally-app
          property: host

      # The anon key, never the service-role key — startup refuses the latter.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Session pooler string (port 5432) for the restricted mcp_oauth_rw role.
      # See supabase/create_mcp_role.sql.
      - key: DATABASE_URL
        sync: false

  # ------------------------------------------------------------------- web app
  - type: web
    name: tally-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # The app is a single-page app: React Router owns the paths, so every
    # unmatched request has to return index.html. Without this, opening
    # /transactions directly — or refreshing it — is a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22"

      # VITE_ variables are baked into the bundle at build time, so these are
      # build inputs, not runtime config — changing one needs a redeploy.
      #
      # The anon key belongs in the bundle: it is public by design, and RLS is
      # what protects the data. A service-role key here would be a disaster.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # Shown on Settings → Connect your AI assistant, and what users paste
      # into their MCP client. Only the hostname is passed, because a blueprint
      # cannot append "/mcp" to a service reference — the app builds the full
      # URL from it.
      - key: VITE_MCP_SERVER_HOST
        fromService:
          type: web
          name: tally
          property: host
